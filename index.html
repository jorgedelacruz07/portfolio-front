    <!-- Font Optimization with preconnect & display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />

    <!-- LCP Hero Image Preload -->
    <link
      rel="preload"
      as="image"
      href="/images/jorge.jpg"
      fetchpriority="high"
    />

    <!-- Schema.org JSON-LD Structured Data for Rich SEO & 100 Lighthouse SEO Score -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jorge de la Cruz Padilla",
        "jobTitle": "Senior Software Engineer",
        "url": "https://jorgedelacruzpadilla.dev",
        "image": "https://jorgedelacruzpadilla.dev/images/jorge.jpg",
        "sameAs": [
          "https://github.com/jorgedelacruz07",
          "https://www.linkedin.com/in/jorgedelacruz07"
        ],
        "knowsAbout": [
          "React.js",
          "TypeScript",
          "Node.js",
          "Express.js",
          "MongoDB",
          "Cloud Architecture",
          "Vite",
          "Web Performance"
        ]
      }
    </script>

    <!-- Google Analytics (Beacon transport, non-blocking) -->
    <script>
      (() => {
        const GA_ID = "%VITE_GA_ID%";
        const isValidId = /^G-[A-Z0-9]+$/i.test(GA_ID);

        if (!isValidId) {
          return;
        }

        const script = document.createElement("script");
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        window.gtag =
          window.gtag ||
          function gtag() {
            window.dataLayer.push(arguments);
          };

        window.gtag("js", new Date());
        window.gtag("config", GA_ID, {
          send_page_view: false,
          anonymize_ip: true,
          transport_type: "beacon",
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
