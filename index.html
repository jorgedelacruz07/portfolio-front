    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var preference =
            stored === "light" || stored === "dark" ? stored : "system";
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark =
            preference === "dark" || (preference !== "light" && systemDark);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          try {
            var fallbackDark = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
            var fallbackRoot = document.documentElement;
            fallbackRoot.classList.toggle("dark", fallbackDark);
            fallbackRoot.style.colorScheme = fallbackDark ? "dark" : "light";
          } catch (ignore) {}
        }
      })();
    </script>

    <!-- Google Analytics (Deferred, non-blocking via requestIdleCallback/load) -->
    <script>
      (() => {
        const GA_ID = "%VITE_GA_ID%";
        const isValidId = /^G-[A-Z0-9]+$/i.test(GA_ID);

        if (!isValidId) {
          return;
        }

        const initGA = () => {
          if (window.__gaInitialized) return;
          window.__gaInitialized = true;

          const script = document.createElement("script");
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];
          window.gtag =
            window.gtag ||
            function gtag() {
              window.dataLayer.push(arguments);
            };

          window.gtag("js", new Date());
          window.gtag("config", GA_ID, {
            send_page_view: false,
            anonymize_ip: true,
            transport_type: "beacon",
          });
        };

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(initGA, { timeout: 3000 });
        } else {
          window.addEventListener("load", initGA, { passive: true });
        }
      })();
    </script>
