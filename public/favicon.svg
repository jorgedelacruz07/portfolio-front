<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Signature Brand Teal Dot -->
  <circle cx="395" cy="115" r="18" fill="url(#tealGrad)"/>

  <!-- Monogram JdC: bold craft typography -->
  <text x="245" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="220" text-anchor="middle" fill="#fafafa" letter-spacing="-6">
    J<tspan font-size="140" font-weight="700" fill="url(#tealGrad)" dx="2" dy="-35">d</tspan><tspan font-size="200" font-weight="800" fill="#fafafa" dx="2" dy="35">C</tspan>
  </text>
</svg>
